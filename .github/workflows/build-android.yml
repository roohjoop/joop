name: Build Android APK (Debug)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "Using preinstalled Android SDK at: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: |
          rm -f bun.lock bun.lockb
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Prepare & Sync Capacitor Android
        run: |
          if [ ! -d "android" ] || [ ! -f "android/build.gradle" ] || [ ! -f "android/settings.gradle" ]; then
            echo "⚡ Android project is missing or incomplete (no build.gradle/settings.gradle). Initializing clean android platform..."
            rm -rf android
            npx cap add android
          else
            echo "✅ Valid Android platform directory exists."
          fi
          echo "🔄 Syncing Capacitor Android assets..."
          npx cap sync android

      - name: Ensure Gradle Wrapper is Executable
        working-directory: android
        run: |
          chmod +x gradlew
          echo "✅ Gradle wrapper is executable."

      - name: Build Android Debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log || {
            echo "::error::Gradle build failed! Displaying root cause:"
            grep -B 2 -A 30 "FAILURE: Build failed" ../gradle.log || tail -n 50 ../gradle.log
            exit 1
          }

      - name: Verify Generated APK
        run: |
          echo "=== Verifying Generated APK ==="
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "✅ APK generated successfully!"
            ls -lh "$APK_PATH"
            # Copy to user-friendly name
            cp "$APK_PATH" "android/app/build/outputs/apk/debug/RoohProJobs-Debug.apk"
          else
            echo "❌ APK file not found at $APK_PATH!"
            find android/app/build -name "*.apk" || true
            exit 1
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RoohProJobs-Debug-APK
          path: android/app/build/outputs/apk/debug/RoohProJobs-Debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Direct APK Download (GitHub Release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Publishing direct APK to GitHub Releases..."
          gh release create android-debug "android/app/build/outputs/apk/debug/RoohProJobs-Debug.apk#تحميل تطبيق شغل وتقنية (APK مباشر)" \
            --title "تطبيق شغل وتقنية - Rooh Pro Jobs (Android APK)" \
            --notes "اضغط على ملف RoohProJobs-Debug.apk في الأسفل لتنزيل التطبيق مباشرة وتثبيته على هاتفك الأندرويد دون الحاجة لفك أي ضغط." \
            --clobber || true
