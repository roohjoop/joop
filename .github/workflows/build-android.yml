name: Build Android APK (Debug)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build Web Application
        run: |
          npm run build

      - name: Prepare & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "⚡ Android platform directory not found in repository. Initializing android platform..."
            npx cap add android
          else
            echo "✅ Android platform directory exists."
          fi
          echo "🔄 Syncing Capacitor Android assets..."
          npx cap sync android

      - name: Ensure Gradle Wrapper is Executable
        working-directory: android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "⚠️ gradlew not found in android directory. Generating Gradle wrapper automatically..."
            gradle wrapper --gradle-version 8.14.3 || true
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "✅ Gradle wrapper is executable."
          else
            echo "ℹ️ gradlew file not present; workflow will use system gradle command."
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          if [ -f "./gradlew" ]; then
            echo "Building with ./gradlew assembleDebug..."
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "Building with system gradle assembleDebug..."
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify Generated APK
        run: |
          echo "=== Verifying Generated APK ==="
          ls -la android/app/build/outputs/apk/debug/ || true
          APK_PATH=$(find android/app/build -name "*debug*.apk" -o -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            ls -lh "$APK_PATH"
            echo "✅ APK generated successfully at $APK_PATH"
            # Ensure standard path
            mkdir -p android/app/build/outputs/apk/debug
            cp -f "$APK_PATH" android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK file not found!"
            find android/app/build || true
            exit 1
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rooh-pro-jobs-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
