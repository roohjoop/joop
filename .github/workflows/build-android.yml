name: Build Android APK (Debug)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: |
          rm -f bun.lock bun.lockb
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Prepare & Sync Capacitor Android
        run: |
          if [ ! -d "android" ] || [ ! -f "android/build.gradle" ] || [ ! -f "android/settings.gradle" ]; then
            echo "⚡ Android project is missing or incomplete (no build.gradle/settings.gradle). Initializing clean android platform..."
            rm -rf android
            npx cap add android
          else
            echo "✅ Valid Android platform directory exists."
          fi
          echo "🔄 Syncing Capacitor Android assets..."
          npx cap sync android

      - name: Ensure Gradle Wrapper is Executable
        working-directory: android
        run: |
          chmod +x gradlew
          echo "✅ Gradle wrapper is executable."

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Verify Generated APK
        run: |
          echo "=== Verifying Generated APK ==="
          ls -la android/app/build/outputs/apk/debug/ || true
          APK_PATH=$(find android/app/build -name "*debug*.apk" -o -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            ls -lh "$APK_PATH"
            echo "✅ APK generated successfully at $APK_PATH"
            # Ensure standard path
            mkdir -p android/app/build/outputs/apk/debug
            cp -f "$APK_PATH" android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK file not found!"
            find android/app/build || true
            exit 1
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rooh-pro-jobs-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
