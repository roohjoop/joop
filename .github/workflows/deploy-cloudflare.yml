name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare (jop)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project & Worker
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'gen-lang-client-0107451639' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:801425782970:web:446cd278663826a61cea83' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyBS9hOMreOzB_bmJNCViN3BaZHPYqvEed4' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'gen-lang-client-0107451639.firebaseapp.com' }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID || 'ai-studio-remixremixremixr-0ff5885e-8089-4896-9c0d-806790e2ed80' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'gen-lang-client-0107451639.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '801425782970' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_EMAIL_TOKEN: ${{ secrets.ADMIN_EMAIL_TOKEN }}
          VITE_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          VITE_ADMIN_EMAIL_TOKEN: ${{ secrets.ADMIN_EMAIL_TOKEN }}
          ADMIN_SECURITY_CODE: ${{ secrets.ADMIN_SECURITY_CODE || secrets.SECURITY_PIN }}
          VITE_ADMIN_SECURITY_CODE: ${{ secrets.ADMIN_SECURITY_CODE || secrets.SECURITY_PIN }}
          VITE_CF_R2_BUCKET_NAME: ${{ secrets.VITE_CF_R2_BUCKET_NAME || 'roohme' }}
          VITE_CF_R2_PUBLIC_URL: ${{ secrets.VITE_CF_R2_PUBLIC_URL || 'https://media.roohpro.com' }}
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL || secrets.ADMIN_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_EMAIL_TOKEN: ${{ secrets.ADMIN_EMAIL_TOKEN }}
        run: |
          echo "=== Starting Cloudflare deployment ==="
          
          # Diagnostic check
          echo "Checking Cloudflare authentication..."
          npx wrangler whoami || echo "Notice: Token check completed."

          echo "Deploying Cloudflare Worker & Static Assets (jop)..."
          if npx wrangler deploy; then
            echo "✅ Cloudflare Worker & Static Assets deployment successful!"
            exit 0
          else
            echo "Deploying via Pages fallback..."
            npx wrangler pages project create jop --production-branch=main --compatibility-date=2024-09-23 || true
            npx wrangler pages deploy dist --project-name=jop --branch=main --commit-dirty
          fi
