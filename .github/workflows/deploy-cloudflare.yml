name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare (joop)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: |
          rm -f bun.lock bun.lockb
          npm install --legacy-peer-deps

      - name: Build Project & Worker
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'gen-lang-client-0028535414' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:54158908506:web:bb22734289e1239488cc63' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyDsh3MyPdlGGcly2woFtjkQigfm8CnPvys' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'gen-lang-client-0028535414.firebaseapp.com' }}
          VITE_FIREBASE_DATABASE_ID: ${{ secrets.VITE_FIREBASE_DATABASE_ID || 'ai-studio-65fe2e47-86e3-4f46-8e5a-fb620e6eea4e' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'gen-lang-client-0028535414.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '54158908506' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || 'a912416981352b81c89ddd294367967e' }}
          VITE_CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || 'a912416981352b81c89ddd294367967e' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'fa73541af4fcdd947ab78c12fe990a34' }}
          VITE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'fa73541af4fcdd947ab78c12fe990a34' }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_EMAIL_TOKEN: ${{ secrets.ADMIN_EMAIL_TOKEN }}
          VITE_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          VITE_ADMIN_EMAIL_TOKEN: ${{ secrets.ADMIN_EMAIL_TOKEN }}
          ADMIN_SECURITY_CODE: ${{ secrets.ADMIN_SECURITY_CODE || secrets.SECURITY_PIN }}
          VITE_ADMIN_SECURITY_CODE: ${{ secrets.ADMIN_SECURITY_CODE || secrets.SECURITY_PIN }}
          VITE_CF_R2_BUCKET_NAME: ${{ secrets.VITE_CF_R2_BUCKET_NAME || 'roohme' }}
          VITE_CF_R2_PUBLIC_URL: ${{ secrets.VITE_CF_R2_PUBLIC_URL || 'https://media.roohpro.com' }}
        run: |
          rm -f public/_redirects dist/_redirects
          npm run build
          rm -f dist/_redirects public/_redirects

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL || secrets.ADMIN_EMAIL || 'roohpro1@gmail.com' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'fa73541af4fcdd947ab78c12fe990a34' }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || 'a912416981352b81c89ddd294367967e' }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_EMAIL_TOKEN: ${{ secrets.ADMIN_EMAIL_TOKEN }}
        run: |
          echo "=== Starting Cloudflare deployment ==="
          rm -f dist/_redirects public/_redirects

          # Sanitize token vs key authentication
          if [ -z "${CLOUDFLARE_API_TOKEN// }" ]; then
            echo "CLOUDFLARE_API_TOKEN is empty; removing from environment so Wrangler uses API Key."
            unset CLOUDFLARE_API_TOKEN
          fi

          if [ -n "${CLOUDFLARE_API_KEY:-}" ]; then
            echo "CLOUDFLARE_API_KEY detected. Using Global API Key authentication."
            if [ -z "${CLOUDFLARE_EMAIL:-}" ]; then
              export CLOUDFLARE_EMAIL="roohpro1@gmail.com"
            fi
            echo "Cloudflare Auth Email set to: $CLOUDFLARE_EMAIL"
            # Ensure API_TOKEN is unset so it doesn't conflict
            unset CLOUDFLARE_API_TOKEN
          fi
          
          # Diagnostic check
          echo "Checking Cloudflare authentication..."
          npx wrangler whoami || echo "Notice: Token check completed."

          echo "Deploying Cloudflare Worker & Static Assets (joop)..."
          if npx wrangler deploy; then
            echo "✅ Cloudflare Worker & Static Assets deployment successful!"
            exit 0
          else
            echo "Deploying via Pages fallback..."
            npx wrangler pages deploy dist --project-name=joop --branch=main --commit-dirty
          fi
